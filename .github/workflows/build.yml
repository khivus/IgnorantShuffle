name: Windows and Android
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cmake -S . -B build-portable -DBUILD_AIMP_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-portable --parallel
      - run: ctest --test-dir build-portable --output-on-failure
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare pinned official AIMP SDK
        shell: pwsh
        run: ./tools/prepare-sdk.ps1
      - name: Build and test plugin
        shell: pwsh
        run: ./build.ps1 -Architecture ${{ matrix.arch }}
      - name: Check component versions and publisher offline
        shell: pwsh
        run: |
          ./tests/version_tests.ps1
          ./tests/publish_tests.ps1
          ./tests/release_bundle_tests.ps1
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - name: Build APK, test state machine, and lint
        working-directory: android
        run: sh ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-debug-and-reports
          if-no-files-found: ignore
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
